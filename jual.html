<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Jual Game - Leonix Shop</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="css/style.css">
  </head>
  <body class="beli-page">
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
      <div class="container-fluid">
        <a class="navbar-brand" href="index.html">Leonix-Shop</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
            <li class="nav-item"><a class="nav-link" href="beli.html">Beli</a></li>
            <li class="nav-item dropdown">
              <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">More</a>
              <ul class="dropdown-menu">
                <li><a class="dropdown-item" href="top.html">Top ratings</a></li>
                <li><a class="dropdown-item active" href="jual.html">Jual</a></li>
                <li><a class="dropdown-item" href="support.html">Support</a></li>
              </ul>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <main class="container page-content">
      <h2 class="beli-title mb-4">Jual Game</h2>
      <div class="row g-4">
        <div class="col-lg-8">
          <form id="sell-form" class="card p-4">
            <div class="mb-3">
              <label class="form-label" for="sell-game">Game yang dipilih</label>
              <select id="sell-game" class="form-select" required>
                <option value="">Pilih game</option>
              </select>
            </div>
            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label" for="sell-name">Nama penjual</label>
                <input id="sell-name" class="form-control" type="text" required>
              </div>
              <div class="col-md-6">
                <label class="form-label" for="sell-price">Harga jual</label>
                <input id="sell-price" class="form-control" type="number" min="1000" required>
              </div>
            </div>
            <div class="mt-3">
              <label class="form-label" for="sell-description">Keterangan</label>
              <textarea id="sell-description" class="form-control" rows="4" placeholder="Contoh: akun full akses, game siap main"></textarea>
            </div>
            <div id="sell-alert" class="alert d-none mt-3 mb-0" role="alert"></div>
          </form>
        </div>

        <aside class="col-lg-4">
          <div class="card h-100">
            <div class="card-header fw-bold">Game pilihan</div>
            <div class="card-body d-flex flex-column">
              <div id="selected-games" class="mb-3"></div>
              <button id="sell-button" class="btn btn-primary mt-auto" type="submit" form="sell-form">
                Jual Sekarang
              </button>
            </div>
          </div>
        </aside>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="script.js"></script>
  </body>
</html>
