<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Support - Leonix Shop</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="css/style.css">
  </head>
  <body class="index-page">
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
      <div class="container-fluid">
        <a class="navbar-brand" href="index.html">Leonix-Shop</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
            <li class="nav-item"><a class="nav-link" href="beli.html">Beli</a></li>
            <li class="nav-item dropdown">
              <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">More</a>
              <ul class="dropdown-menu">
                <li><a class="dropdown-item" href="top.html">Top ratings</a></li>
                <li><a class="dropdown-item" href="jual.html">Jual</a></li>
                <li><hr class="dropdown-divider"></li>
                <li><a class="dropdown-item active" href="support.html">Support</a></li>
              </ul>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <main class="container page-content">
      <div class="mx-auto" style="max-width: 680px;">
        <div class="mb-4">
          <h2 class="beli-title mb-2">Hubungi Support</h2>
          <p class="beli-subtitle mb-0">Ada pertanyaan atau kendala? Isi form berikut.</p>
        </div>
        <form class="card p-4 p-md-5">
          <div class="mb-3">
            <label class="form-label" for="support-name">Nama</label>
            <input class="form-control" id="support-name" name="name" type="text" autocomplete="name" required>
          </div>
          <div class="mb-3">
            <label class="form-label" for="support-email">Email</label>
            <input class="form-control" id="support-email" name="email" type="email" autocomplete="email" required>
          </div>
          <div class="mb-3">
            <label class="form-label" for="support-topic">Topik</label>
            <select class="form-select" id="support-topic" name="topic" required>
              <option value="" selected disabled>Pilih topik</option>
              <option value="pembelian">Pembelian</option>
              <option value="penjualan">Penjualan</option>
              <option value="akun">Masalah akun</option>
              <option value="lainnya">Lainnya</option>
            </select>
          </div>
          <div class="mb-4">
            <label class="form-label" for="support-message">Pesan</label>
            <textarea class="form-control" id="support-message" name="message" rows="5" required></textarea>
          </div>
          <button class="btn btn-primary align-self-start" type="submit">Kirim Pesan</button>
        </form>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  </body>
</html>
